# Finetune attack — v11 strong locked ckpt, higher attacker LR (5e-5), 3000 steps
# PURPOSE: test whether attacker convergence is LR-limited at 1e-5.
# If gap shrinks at 5e-5 → unlocked model just converges faster, not a real floor.
# If gap holds → floor is genuine regardless of attacker LR.
# Comparison: ft_attack_v11_strong_3k (same ckpt, lr=1e-5)

mode: both
run_name: ft_attack_v11_strong_5e5

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 3000
lr: 5e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adafactor

# ALL 32 blocks
target_blocks: 32

locked_ckpt: results/lock_v11_strong/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
