# Finetune attack — v11 strong lock, SGD lr=1e-4, 3000 steps
# PURPOSE: test the paper's core theoretical claim directly.
# Theory: high σ_max forces SGD to use small LR (unsafe at large LR).
# Adafactor/AdamW at 1e-4 → gap collapses to +0.009 (confirmed).
# If SGD at 1e-4 → gap also collapses: theory is wrong, mechanism doesn't work even in principle.
# If SGD at 1e-4 → gap holds or diverges: theory holds but only against non-adaptive attackers.
#
# COMPARE:
#   Adafactor 1e-5 3k:  gap +0.106   (baseline, artificially weak attacker)
#   Adafactor 5e-5 3k:  gap +0.006   (stronger attacker, lock collapses)
#   AdamW 1e-4 3k:      gap +0.009   (realistic attacker, lock collapses)
#   SGD 1e-4 3k:        gap = ?      (THIS RUN)

mode: both
run_name: ft_attack_v11_strong_sgd_1e4

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 3000
lr: 1e-4
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: sgd

# ALL 32 blocks
target_blocks: 32

locked_ckpt: results/lock_v11_strong/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
