# Finetune attack — retain-only ablation, 3000 steps
# PURPOSE: measure how much attacker gap is explained by retain-finetuning alone (no spectral lock).
# Compare gap here vs ft_attack_v11_strong_3k to isolate true spectral effect.
# mode: 'both' → locked (from retain-only ckpt) then unlocked (from base Evo) sequentially

mode: both
run_name: ft_attack_ablation_retain_only_3k

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 3000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adafactor

# ALL 32 blocks
target_blocks: 32

# Retain-only checkpoint (no spectral inflation)
locked_ckpt: results/lock_ablation_retain_only/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
