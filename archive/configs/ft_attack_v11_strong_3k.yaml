# Finetune attack — v11 strong, 3000 steps (extended attacker budget)
# PURPOSE: test whether the v11 lock gap holds or closes with 2x more attacker compute.
# Uses same lock checkpoint as ft_attack_v11_strong (lock_v11_strong/model_locked.pt).
#
# save_checkpoint: false — results-only run
# mode: 'both' → locked then unlocked sequentially

mode: both
run_name: ft_attack_v11_strong_3k

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 3000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adafactor

# ALL 32 blocks
target_blocks: 32

# Same lock as v11 strong
locked_ckpt: results/lock_v11_strong/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
