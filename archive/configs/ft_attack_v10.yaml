# Finetune attack — v10 (910-seq attack dataset, all 32 blocks)
#
# mode: 'both' → runs locked then unlocked sequentially
#        'locked' → locked only, 'unlocked' → unlocked only
# Override from CLI: python finetune.py --config this.yaml --locked
#
# results_dir is auto-derived:
#   locked  → results/ft_attack_v10_locked/
#   unlocked → results/ft_attack_v10_unlocked/

mode: both
run_name: ft_attack_v10

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 5000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw

# target_blocks: integer N → set(range(N))
target_blocks: 32

# Locked checkpoint path (used when mode includes 'locked')
locked_ckpt: results/lock_v10/model_locked.pt

save_checkpoint: true
use_gradient_checkpointing: true
