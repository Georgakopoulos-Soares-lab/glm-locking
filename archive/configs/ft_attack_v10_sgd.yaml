# Finetune attack — SGD optimizer test (reuses existing lock_v10_full checkpoint)
# PURPOSE: test whether adaptive optimizer (adafactor) neutralizes the lock.
# SGD with momentum has NO per-parameter scaling, so high sigma_max should slow it.
# Compare gap here vs ft_attack_v10_full results to confirm/deny the hypothesis.
#
# save_checkpoint: false — results-only run
# mode: 'both' → locked then unlocked sequentially

mode: both
run_name: ft_attack_v10_sgd

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 1500
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: sgd

# ALL 32 blocks
target_blocks: 32

# Reuse existing v10 locked checkpoint — no relocking needed
locked_ckpt: results/lock_v10_full/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
