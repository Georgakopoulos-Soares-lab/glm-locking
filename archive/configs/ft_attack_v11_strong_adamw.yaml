# Finetune attack — v11 strong locked ckpt, AdamW lr=1e-4, 3000 steps
# PURPOSE: test if AdamW with a proper LR (1e-4) changes the gap vs Adafactor 1e-5.
# Adafactor and SGD at 1e-5 showed nearly identical gaps in v10 experiments.
# This tests a genuinely different optimizer + LR combination on the stronger v11 lock.
# Note: AdamW uses true per-param second moments, may converge more cleanly.

mode: both
run_name: ft_attack_v11_strong_adamw

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 3000
lr: 1e-4
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw

# ALL 32 blocks
target_blocks: 32

locked_ckpt: results/lock_v11_strong/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
