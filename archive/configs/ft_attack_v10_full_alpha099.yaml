# Finetune attack — FULL experiment (all 32 blocks, 20k steps)
# Alpha=0.99 variant: uses checkpoint from lock_v10_full_alpha099
#
# mode: 'both' → runs locked then unlocked sequentially
# results_dir auto-derived:
#   locked   → results/ft_attack_v10_full_alpha099_locked/
#   unlocked → results/ft_attack_v10_full_alpha099_unlocked/

mode: both
run_name: ft_attack_v10_full_alpha099

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
# 20 epochs over attack data: 819 train seqs / (batch=1 × accum=4 × 3 GPUs=12/step) ≈ 68 steps/epoch × 20 = 1360 → 1500
train_steps: 1500
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adafactor

# ALL 32 blocks (must match lock config)
target_blocks: 32

# Locked checkpoint path (must match lock_v10_full_alpha099 output)
locked_ckpt: results/lock_v10_full_alpha099/model_locked.pt

save_checkpoint: true
use_gradient_checkpointing: true
