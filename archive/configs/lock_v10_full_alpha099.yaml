# SpecDef lock — FULL experiment (all 32 blocks, top_k=5, 10k steps)
# Alpha=0.99 variant: fixed alpha as used in the paper (text-classification experiments, B.2)
# Compared to lock_v10_full.yaml which uses a 0.8→0.3 linear schedule,
# here alpha_start=alpha_end=0.99 (no schedule, constant retain weight per paper).
# results_dir is auto-derived as results/{run_name}

run_name: lock_v10_full_alpha099

# --- Data ---
retain_data_path: data/retain.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 512

# --- Lock hyperparameters ---
lock_steps: 2000
lock_lr: 5e-5
alpha_start: 0.99
alpha_end: 0.99
top_k: 5


# freeze_non_targets: true  = only target matrices trained (default, ~15 GB)
# freeze_non_targets: false = all params trained, paper Algorithm 1 (~39 GB)
freeze_non_targets: true

# --- Compute ---
batch_size: 1
seq_len: 1024
grad_accum_steps: 12
use_gradient_checkpointing: true

# --- Eval ---
val_every: 100
val_batches: 8
max_grad_norm: 1.0
optimizer_name: adafactor

# ALL 32 blocks
target_blocks: 32
target_layer_patterns:
  - .projections.weight
  - .out_filter_dense.weight
  - .inner_mha_cls.Wqkv.weight
  - .inner_mha_cls.out_proj.weight
  - .mlp.l1.weight
  - .mlp.l2.weight
  - .mlp.l3.weight

save_checkpoint: true
