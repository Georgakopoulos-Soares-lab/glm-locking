# Finetune attack — v11 strong locked ckpt, 10000 steps (convergence test)
# PURPOSE: determine if the gap at 3k steps is a real floor or if both models
#   keep converging and the gap closes with sufficient compute.
# If gap at 10k ≈ gap at 3k → floor confirmed.
# If gap closes → lock effect is a delay, not a barrier.

mode: both
run_name: ft_attack_v11_strong_10k

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 10000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adafactor

# ALL 32 blocks
target_blocks: 32

locked_ckpt: results/lock_v11_strong/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
