# Finetune attack — direct scale lock ×100, 3000 steps
# PURPOSE: measure attacker gap when locked model has σ ≈ 100× baseline (vs σ ≈ 30× for v11_strong)
# Comparison: ft_attack_v11_strong_3k (gradient lock, gap +0.106)
# If gap >> +0.106: stronger spectral inflation = stronger barrier (validates σ_max hypothesis)
# If gap ≈ +0.106: σ magnitude is not the limiting factor

mode: both
run_name: ft_attack_direct_scale_x100_3k

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 3000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 50
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adafactor

# ALL 32 blocks
target_blocks: 32

locked_ckpt: results/lock_direct_scale_x100/model_locked.pt

save_checkpoint: false
use_gradient_checkpointing: true
