# SpecDef lock — topk5, 5000 steps (v9 pipeline)
# results_dir is auto-derived as results/{run_name}

run_name: lock_topk5_5000steps

# --- Data ---
retain_data_path: data/retain.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 512

# --- Lock hyperparameters ---
lock_steps: 5000
lock_lr: 5e-5
alpha_start: 0.8
alpha_end: 0.3
top_k: 5

# --- Compute ---
batch_size: 8
seq_len: 1024
grad_accum_steps: 1

# --- Eval ---
val_every: 50
val_batches: 8
max_grad_norm: 1.0

# target_blocks: integer N → set(range(N))
target_blocks: 32
target_layer_patterns:
  - .projections.weight
  - .out_filter_dense.weight
  - .mlp.l1.weight
  - .mlp.l2.weight
  - .mlp.l3.weight

save_checkpoint: true
use_gradient_checkpointing: true
