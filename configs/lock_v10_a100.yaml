# SpecDef lock — v10 A100-40GB variant (8 target blocks)
# Fits within 40GB VRAM: model 12.8GB + lock optimizer ~10GB + activations ~3GB ≈ 28GB
# results_dir is auto-derived as results/{run_name}

run_name: lock_v10_a100

# --- Data ---
retain_data_path: data/retain.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 512

# --- Lock hyperparameters ---
lock_steps: 5000
lock_lr: 5e-5
alpha_start: 0.8
alpha_end: 0.3
top_k: 3

# --- Compute ---
batch_size: 8
seq_len: 1024
grad_accum_steps: 1

# --- Eval ---
val_every: 50
val_batches: 8
max_grad_norm: 1.0

# 8 blocks fits A100-40GB (lock mem ~28GB)
target_blocks: 8
target_layer_patterns:
  - .projections.weight
  - .out_filter_dense.weight
  - .mlp.l1.weight
  - .mlp.l2.weight
  - .mlp.l3.weight

save_checkpoint: true
