# Attack on SpecDef alpha=1k locked model
# Tests whether exact SpecDef at alpha=1000 resists standard Adafactor attack
#
# mode: 'both' → runs locked then unlocked

mode: both
run_name: ft_specdef_alpha1k

data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

train_steps: 3000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adafactor

target_blocks: 32

locked_ckpt: results/lock_specdef_alpha1k/model_specdef.pt

save_checkpoint: false
use_gradient_checkpointing: true
