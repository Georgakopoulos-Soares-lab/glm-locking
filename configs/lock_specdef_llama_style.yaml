# SpecDef locking — Llama-style: locks all "write-back to residual stream" projections
#
# Paper locks gate_proj + v_proj + o_proj in Llama (~32% of params).
# Evo equivalents chosen to keep C matrices at [4096×4096] (manageable size):
#   out_filter_dense       [4096, 4096]  — Hyena output projection  (= o_proj)
#   inner_mha_cls.out_proj [4096, 4096]  — Attn output projection   (= o_proj)
#   mlp.l3                 [4096, 10928] — MLP down-projection       (= down_proj)
#
# NOTE: projections [12288×4096] and mlp.l1 [10928×4096] are excluded because
# their C matrices would be [12288×12288] and [10928×10928] respectively
# (150M and 120M params per block × 32 blocks ≈ 35 GB checkpoint overhead).
# mlp.l3 [4096×10928] is fine: C is [4096×4096] = 16.8M params per block.
#
# Total locked (new): ~32 × (16.8M + 16.8M) ≈ 1,074M / 6,992M = ~15% of params
# (vs existing lock_specdef_paper_all: 7.7%)
#
run_name: lock_specdef_llama_style
alpha: 10000.0
top_k: 25
target_blocks: 32
num_target_layers: 0    # 0 = all matching layers in all target_blocks
target_layer_patterns:
  - out_filter_dense
  - inner_mha_cls.out_proj
  - mlp.l3
retain_data_path: data/retain.fasta
