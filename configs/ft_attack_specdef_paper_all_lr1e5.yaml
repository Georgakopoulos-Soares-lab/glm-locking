# Attack fine-tuning against paper_all lock (32 layers: out_filter_dense + out_proj)
# Baseline comparison against llama-style (64 layers: + mlp.l3)
# Same settings as ft_attack_specdef_llama_style_lr1e5.yaml — only checkpoint differs
mode: locked
run_name: ft_attack_specdef_paper_all_lr1e5
locked_ckpt: results/lock_specdef_paper_all/model_specdef.pt

lr: 1.0e-5
train_steps: 5000
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw8bit

data_path: data/attack.fasta
train_fraction: 0.9
seed: 42

target_blocks: 32
save_checkpoint: true
use_gradient_checkpointing: true
