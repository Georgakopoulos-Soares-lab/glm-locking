# Attack config — paper-faithful (Rosati et al., 2026)
# Key differences from previous configs:
#   1. freeze_comp: false — C is TRAINABLE (Hessian cross-term causes divergence)
#   2. weight_decay: 0.01 — matches paper's AdamW setup
#   3. warmup_fraction: 0.1 — 10% linear LR warmup
#   4. lr: 1e-5 — conservative learning rate
#
# Expects locked_ckpt from lock_specdef_paper.yaml or lock_specdef_paper_all.yaml
mode: both
run_name: ft_paper_lr1e5

locked_ckpt: results/lock_specdef_paper_all/model_specdef.pt
data_path: data/attack.fasta

train_steps: 5000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw
weight_decay: 0.01
warmup_fraction: 0.1

target_blocks: 32
freeze_comp: false
freeze_filter_params: false
use_gradient_checkpointing: true
save_checkpoint: true
