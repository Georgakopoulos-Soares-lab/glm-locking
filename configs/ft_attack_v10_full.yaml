# Finetune attack — FULL experiment (all 32 blocks, 20k steps)
# Definitive run: ~2.15 epochs over attack data — no doubt about convergence
# Target GPU: H100 80GB (~79GB peak memory, tight but fits)
#
# mode: 'both' → runs locked then unlocked sequentially
# results_dir auto-derived:
#   locked   → results/ft_attack_v10_full_locked/
#   unlocked → results/ft_attack_v10_full_unlocked/

mode: both
run_name: ft_attack_v10_full

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 20000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 200
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw

# ALL 32 blocks (must match lock config)
target_blocks: 32

# Locked checkpoint path (must match lock_v10_full output)
locked_ckpt: results/lock_v10_full/model_locked.pt

save_checkpoint: true
use_gradient_checkpointing: true
