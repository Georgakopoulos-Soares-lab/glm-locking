# Attack config — paper-faithful, lr=3e-5
mode: both
run_name: ft_paper_lr3e5

locked_ckpt: results/lock_specdef_paper_all/model_specdef.pt
data_path: data/attack.fasta

train_steps: 5000
lr: 3e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw
weight_decay: 0.01
warmup_fraction: 0.1

target_blocks: 32
freeze_comp: false
freeze_filter_params: false
use_gradient_checkpointing: true
save_checkpoint: true
