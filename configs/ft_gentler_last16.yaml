# Attack config — fewer layers variant: alpha=10k, top_k=25, last 16 blocks only
# Lock: results/lock_specdef_last16_paper_all/model_specdef.pt
# Purpose: test whether locking only blocks 16..31 preserves early-layer
#          biological representations while still resisting attacks.
mode: both
run_name: ft_gentler_last16

locked_ckpt: results/lock_specdef_last16_paper_all/model_specdef.pt
data_path: data/attack.fasta

train_steps: 5000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw
weight_decay: 0.01
warmup_fraction: 0.1

target_blocks: 32
freeze_comp: false
freeze_filter_params: false
use_gradient_checkpointing: true
save_checkpoint: true
