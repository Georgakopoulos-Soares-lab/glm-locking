# Finetune attack — UNLOCKED baseline for v9 pipeline comparison
# 20 epochs = 33600 steps  |  all 32 blocks
# Paired with: ft_locked_topk5_5000lock_20ep.yaml
# results_dir is auto-derived as results/{run_name}

run_name: ft_unlocked_topk5_5000lock_20ep_h100

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 33600   # 20 epochs × 1678 windows (seq_len=1024)
lr: 5e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 1
val_every: 500
eval_batches: 8
max_grad_norm: 1.0
optimizer_name: adamw

# target_blocks: integer N → set(range(N))
target_blocks: 32
# locked_ckpt omitted → None (unlocked baseline)

save_checkpoint: true
use_gradient_checkpointing: true
