# SpecDef locking — paper-faithful (Rosati et al., 2026, arxiv 2602.18868)
# Matches ICML 2026 submission: alpha=10k, k=25, 5 random layers,
# targets both Hyena out_filter_dense and attention out_proj.
run_name: lock_specdef_paper
alpha: 10000.0
top_k: 25
target_blocks: 32
num_target_layers: 5
target_layer_patterns:
  - out_filter_dense
  - inner_mha_cls.out_proj
retain_data_path: data/retain.fasta
