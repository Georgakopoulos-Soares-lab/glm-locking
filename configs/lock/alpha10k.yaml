# SpecDef locking — paper-faithful, ALL square layers locked
# Same as lock_specdef_paper.yaml but locks all 32 candidate layers
# (29 out_filter_dense + 3 inner_mha_cls.out_proj) instead of 5 random.
run_name: lock_alpha10k
alpha: 10000.0
top_k: 25
target_blocks: 32
num_target_layers: 0    # 0 = all matching layers
target_layer_patterns:
  - out_filter_dense
  - inner_mha_cls.out_proj
retain_data_path: data/retain.fasta
