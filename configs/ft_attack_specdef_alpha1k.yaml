# SpecDef attack — alpha=1000, all 29 Hyena blocks
#
# Runs both locked (SpecDef) and unlocked (pretrained) for comparison.
# The locked model uses SpecDefLinear wrappers (f32 two-matmul computation).
# Evaluation uses fused bf16 weights for fair comparison.

mode: both
run_name: ft_attack_specdef_alpha1k

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 5000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw

target_blocks: 32

# SpecDef locked checkpoint
locked_ckpt: results/lock_specdef_alpha1k/model_specdef.pt

save_checkpoint: true
use_gradient_checkpointing: true
