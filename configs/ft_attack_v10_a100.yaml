# Finetune attack — v10 A100-40GB variant (8 target blocks)
# Fits within 40GB VRAM: model 12.8GB + FT optimizer ~16GB + activations ~2GB ≈ 31GB
#
# mode: 'both' → runs locked then unlocked sequentially
# results_dir auto-derived:
#   locked   → results/ft_attack_v10_a100_locked/
#   unlocked → results/ft_attack_v10_a100_unlocked/

mode: both
run_name: ft_attack_v10_a100

# --- Data ---
data_path: data/attack.fasta
model_name: evo-1-8k-base
seed: 42
train_fraction: 0.9
min_seq_len: 1024

# --- Training ---
train_steps: 5000
lr: 1e-5
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw

# 8 blocks to match lock_v10_a100
target_blocks: 8

# Locked checkpoint path (must match lock config run_name)
locked_ckpt: results/lock_v10_a100/model_locked.pt

save_checkpoint: true
use_gradient_checkpointing: true
