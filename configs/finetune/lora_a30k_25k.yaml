mode: locked
run_name: ft_lora_a30k_25k
data_path: data/attack_train.fasta
val_data_path: data/attack_heldout.fasta
train_steps: 25000
lr: 1.0e-05
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw8bit
weight_decay: 0.0
warmup_fraction: 0.0
target_blocks: 32
freeze_comp: true
save_checkpoint: true
checkpoint_every: 2000
train_fraction: 0.9
seed: 42
locked_ckpt: results/lock_alpha30k/model_specdef.pt
results_dir: results/ft_lora_a30k_25k
# LoRA adapter on all non-locked backbone linears (SpecDefLinear internals auto-skipped).
# Paired comparison to bypass_a10k_25k_v2:
#   bypass trains 32 output-side B matrices (d_out×d_out, 537M param)
#   LoRA  trains rank-16 A+B adapters on backbone linears (~26M param)
# If LoRA achieves similar AUROC → any PEFT method defeats SpecDef.
# If bypass outperforms → the C@W̃=W cancellation mechanism is the key ingredient.
use_lora: true
lora_rank: 16
lora_alpha: 32.0
lora_target_substrings: ["mlp.l", "projections", "Wqkv"]
# MUST set cast_comp_bf16: false for LoRA runs (or any run using specdef_fused_eval
# with raw SpecDefLinear present). Casting C to bf16 then computing fused_w = C_bf16@W̃
# produces catastrophic error amplified by σ_max(W̃)=215,339 → val_ppl ~280.
# Memory cost: 32 comp matrices × 4096² × 4 bytes ≈ 2GB extra GPU memory (acceptable).
cast_comp_bf16: false
# Gradient checkpointing note: use_reentrant=False (current) breaks LoRA forward.
# Disable grad checkpointing since 31M trainable params need no memory savings.
use_gradient_checkpointing: false
# Targets 128 non-locked linears: 4 per block × 32 blocks
# (mlp.l1/l2/l3 + projections per block; Wqkv where present).
# SpecDefLinear internals auto-skipped by inject_lora skip_prefixes logic.
# Equivalent coverage to [""] (same 128 layers) but explicit and safe.
