mode: locked
run_name: ft_theorem8_a30k_k1_25k
data_path: data/attack_train.fasta
val_data_path: data/attack_heldout.fasta
train_steps: 25000
lr: 1.0e-05
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw8bit
weight_decay: 0.0
warmup_fraction: 0.0
target_blocks: 32
# Theorem 8 SVD-factorization attack — k=1 (ablation, no factorization).
# k=1 means W̃ is replaced by a single trainable factor (identity init).
# σ_max per factor = σ₁(W̃)^(1/1) ≈ 447000 (α=3×10⁴ lock).
# Expected: still unable to train stably; confirms k=1 is insufficient.
theorem8_injection: true
theorem8_k: 1
freeze_comp: true
use_gradient_checkpointing: true
save_checkpoint: true
checkpoint_every: 2000
plateau_window: 10
plateau_delta: 0.002
train_fraction: 0.9
seed: 42
locked_ckpt: results/lock_alpha30k/model_specdef.pt
results_dir: results/ft_theorem8_a30k_k1_25k
