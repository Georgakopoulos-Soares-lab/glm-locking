mode: locked
run_name: ft_locked_a30k_lr1e5_25k
data_path: data/attack_train.fasta
val_data_path: data/attack_heldout.fasta
train_steps: 25000
lr: 1.0e-05
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw8bit
weight_decay: 0.0
warmup_fraction: 0.0
target_blocks: 32
# Ablation: naive FT at the same LR and gradient clipping as SVD-chain k=1.
# freeze_comp=true matches k=1 (C frozen, only W̃ trains).
# This isolates whether k=1's AUROC advantage comes from LR/clipping alone
# or from the structural difference (free replacement matrix vs W̃ in place).
freeze_comp: true
use_gradient_checkpointing: true
save_checkpoint: true
checkpoint_every: 2000
plateau_window: 10
plateau_delta: 0.002
train_fraction: 0.9
seed: 42
locked_ckpt: results/lock_alpha30k/model_specdef.pt
results_dir: results/ft_locked_a30k_lr1e5_25k
