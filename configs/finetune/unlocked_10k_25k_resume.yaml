val_every: 100
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw8bit
weight_decay: 0.0
warmup_fraction: 0.0
target_blocks: 32
freeze_comp: false
save_checkpoint: true
checkpoint_every: 2000
seed: 42
results_dir: results/ft_unlocked_10k_25k_resume
resume_from: results/ft_unlocked_10k_25k_unlocked/checkpoints/step_04000.pt
