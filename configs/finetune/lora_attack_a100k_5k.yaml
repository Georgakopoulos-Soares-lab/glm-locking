mode: locked
run_name: ft_locked_a100k_lora_attack_5k
data_path: data/attack_train.fasta
val_data_path: data/attack_heldout.fasta
train_steps: 5000
lr: 1.0e-04          # LoRA params have small magnitude; can use larger LR
batch_size: 1
seq_len: 1024
grad_accum_steps: 4
val_every: 200
eval_batches: 16
max_grad_norm: 1.0
optimizer_name: adamw8bit
weight_decay: 0.0
warmup_fraction: 0.05      # 250 steps warmup
lr_schedule: cosine        # then cosine decay
target_blocks: 32
freeze_comp: false
use_gradient_checkpointing: true
save_checkpoint: true
train_fraction: 0.9
seed: 42
locked_ckpt: results/lock_alpha100k/model_specdef.pt
results_dir: results/ft_locked_a100k_lora_attack_5k
# LoRA: rank 16 on every linear inside a SpecDef-wrapped block
use_lora: true
lora_rank: 16
lora_alpha: 32.0
# Target every Linear that is NOT inside a SpecDefLinear: MLP l1/l2/l3, the
# fused qkv/projections, and Wqkv on attention blocks. 128 modules total.
lora_target_substrings: ["mlp.l", "projections", "Wqkv"]
